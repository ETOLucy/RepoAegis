services:
  api:
    build:
      context: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      REPO_AGENT_ENVIRONMENT: production
      REPO_AGENT_API_TOKENS: ${REPO_AGENT_API_TOKENS:?set REPO_AGENT_API_TOKENS}
      REPO_AGENT_DATABASE_URL: postgresql+psycopg://repo_agent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/repo_agent
      REPO_AGENT_ARTIFACT_ROOT: /artifacts
      REPO_AGENT_ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - artifacts:/artifacts
    networks:
      - control
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build:
      context: .
    command: ["repo-agent-worker"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      REPO_AGENT_ENVIRONMENT: production
      REPO_AGENT_DATABASE_URL: postgresql+psycopg://repo_agent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/repo_agent
      REPO_AGENT_ARTIFACT_ROOT: /artifacts
      REPO_AGENT_WORKSPACE_ROOT: /workspaces
      REPO_AGENT_REPOSITORY_LOCATORS: ${REPO_AGENT_REPOSITORY_LOCATORS:?set REPO_AGENT_REPOSITORY_LOCATORS}
      REPO_AGENT_WORKER_TENANT_IDS: ${REPO_AGENT_WORKER_TENANT_IDS:?set REPO_AGENT_WORKER_TENANT_IDS}
      REPO_AGENT_SANDBOX_RUNNER_URL: http://sandbox-runner:8080
      REPO_AGENT_SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:?set SANDBOX_RUNNER_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - artifacts:/artifacts
      - workspaces:/workspaces
    networks:
      - control
      - egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  sandbox-runner:
    build:
      context: .
    command:
      - uvicorn
      - repo_maintenance_agent.sandbox.runner_service:build_application
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "1"
    environment:
      REPO_AGENT_ENVIRONMENT: production
      REPO_AGENT_WORKSPACE_ROOT: /workspaces
      REPO_AGENT_SANDBOX_RUNNER_TOKEN: ${SANDBOX_RUNNER_TOKEN:?set SANDBOX_RUNNER_TOKEN}
      REPO_AGENT_SANDBOX_DOCKER_HOST: tcp://sandbox-daemon:2375
      REPO_AGENT_SANDBOX_SECCOMP_PROFILE: /app/sandbox/seccomp.json
    depends_on:
      sandbox-daemon:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    read_only: true
    tmpfs:
      - /tmp:size=128m
    volumes:
      - workspaces:/workspaces:ro
    networks:
      - control
      - sandbox-daemon
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  sandbox-daemon:
    image: docker:29.1-dind-rootless@sha256:3f2db3470a9c852cb3493b458358ec3a170a710b68f699db161b7ed87ec8583a
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375"]
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - sandbox-data:/home/rootless/.local/share/docker
      - workspaces:/workspaces
    networks:
      - sandbox-daemon
      - sandbox-egress

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: repo_agent
      POSTGRES_USER: repo_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - control

  opensearch:
    # Local development only: security is disabled and the port is loopback-bound.
    image: opensearchproject/opensearch:3.2.0@sha256:23297b8d8545e129dd58c254ed08d786dc552410ba772983ad2af31048d2f04b
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - control

volumes:
  artifacts:
  postgres-data:
  opensearch-data:
  sandbox-data:
  workspaces:

networks:
  control:
    internal: true
  sandbox-daemon:
    internal: true
  egress:
  sandbox-egress:
