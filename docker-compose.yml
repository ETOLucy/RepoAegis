services:
  api:
    build:
      context: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      REPO_AGENT_ENVIRONMENT: production
      REPO_AGENT_API_TOKENS: ${REPO_AGENT_API_TOKENS:?set REPO_AGENT_API_TOKENS}
      REPO_AGENT_DATABASE_URL: postgresql+psycopg://repo_agent:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/repo_agent
      REPO_AGENT_ARTIFACT_ROOT: /artifacts
      REPO_AGENT_ALLOWED_HOSTS: '["localhost","127.0.0.1"]'
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m
    volumes:
      - artifacts:/artifacts
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: repo_agent
      POSTGRES_USER: repo_agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repo_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  opensearch:
    # Local development only: security is disabled and the port is loopback-bound.
    image: opensearchproject/opensearch:3.2.0@sha256:23297b8d8545e129dd58c254ed08d786dc552410ba772983ad2af31048d2f04b
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - opensearch-data:/usr/share/opensearch/data

volumes:
  artifacts:
  postgres-data:
  opensearch-data:
