name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,postgres,observability]"
      - run: ruff check src tests scripts
      - run: mypy src scripts/build_brand_assets.py scripts/validate_logo_assets.py --exclude 'src/repo_maintenance_agent/inspect/'
      - run: node --check src/repo_maintenance_agent/console/app.js
      - run: python -m pytest --cov --cov-report=term-missing
      - run: python scripts/validate_logo_assets.py docs
      - run: python -m repo_maintenance_agent.security.scanner
      - run: pip-audit
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder
          REPO_AGENT_API_TOKENS: '{"ci-token":"tenant-ci"}'
          SANDBOX_RUNNER_TOKEN: ci-sandbox-runner-token
          REPO_AGENT_REPOSITORY_LOCATORS: '{"ci-repo":{"type":"local","path":"/tmp/ci-repo"}}'
          REPO_AGENT_WORKER_TENANT_IDS: '["ci"]'
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: ci-opensearch-password
      - run: docker build --tag repo-aegis:ci .
      - run: docker build --file sandbox/Dockerfile.python --tag repo-agent-python:ci .

