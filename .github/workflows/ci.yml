name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,postgres,observability]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest --cov --cov-report=term-missing
      - run: python -m repo_maintenance_agent.security.scanner
      - run: pip-audit
      - run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder
          REPO_AGENT_API_TOKENS: '{"ci-token":"tenant-ci"}'
      - run: docker build --tag repo-maintenance-agent:ci .
      - run: docker build --file sandbox/Dockerfile.python --tag repo-agent-python:ci .
