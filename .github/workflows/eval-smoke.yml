name: eval-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eval-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Run evaluation smoke (deterministic fixture observations)
        run: python scripts/run_eval_smoke.py --suite examples/evaluation/suite.json --observations examples/evaluation/observations.json --json-report artifacts/eval-smoke.json
